<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#161822" />

  <title>Flowers</title>
  <meta name="description" content="A rotating 3D ASCII flower bouquet." />

  <!-- Open Graph / Social Share Preview Card -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://oliverknapp.github.io/flowers/" />
  <meta property="og:title" content="Flowers" />
  <meta property="og:description" content="A rotating 3D ASCII flower bouquet." />
  <meta property="og:image" content="https://oliverknapp.github.io/flowers/assets/og-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A colorful rotating 3D ASCII art flower bouquet" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Flowers" />
  <meta name="twitter:description" content="A rotating 3D ASCII flower bouquet." />
  <meta name="twitter:image" content="https://oliverknapp.github.io/flowers/assets/og-preview.png" />

  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />

  <!-- Optional crisp monospace webfont with instant system monospace fallback -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./styles.css?v=6" />
</head>
<body>
  <button
    id="theme-toggle"
    class="theme-toggle"
    type="button"
    aria-label="Switch to light background"
    aria-pressed="true"
    title="Switch dark / light background"
  >
    <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
    </svg>
  </button>

  <main class="stage" aria-label="Animated 3D rotating ASCII flower bouquet">
    <canvas
      id="bouquet-canvas"
      class="bouquet-canvas"
      role="img"
      aria-label="A colorful blooming and rotating 3D ASCII art flower bouquet with pink, white, red, purple, and yellow flowers wrapped in paper with a pink ribbon"
    ></canvas>

    <footer class="caption" id="caption" aria-live="polite">
      <span class="caption-text" id="caption-text"></span>
    </footer>
  </main>

  <noscript>
    <p class="noscript-fallback">Please enable JavaScript to view the flower bouquet.</p>
  </noscript>

  <script type="module" src="./js/main.js?v=6"></script>
</body>
</html>
